<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hana – Arietta mog srca</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1 class="title">Arietta mog srca</h1>
    <p class="subtitle">Posvećeno Hani Salihović</p>

    <div class="quote-box" id="quoteBox">
      <p class="quote">"Kao da sopran srca mog pjeva tvoje ime u svakoj tišini."</p>
    </div>

    <button onclick="newQuote()">Za Hanu</button>

    <audio id="music" loop>
      <source src="https://musopen.org/data/media/recordings/1118/19883_ombrah_maifu.mp3" type="audio/mpeg">
      Tvoj preglednik ne podržava audio.
    </audio>
  </div>

  <script>
    const quotes = [
      "Kao da sopran srca mog pjeva tvoje ime u svakoj tišini.",
      "U tvom pogledu, sve arije pronalaze svoj kraj.",
      "Ti si melodija koju nijedna opera ne može otpjevati do kraja.",
      "Kada šutiš, svijet se čini kao najnježnija partitura.",
      "Hana, ti si moja jedina scena i posljednji aplauz."
    ];

    function newQuote() {
      const random = Math.floor(Math.random() * quotes.length);
      document.getElementById('quoteBox').innerHTML = `<p class="quote">${quotes[random]}</p>`;
      const music = document.getElementById('music');
      if (music.paused) {
        music.play().catch(() => {
          console.log("Audio playback blocked.");
        });
      }
    }
  </script>
</body>
</html>
