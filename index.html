<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arietta mog srca</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: radial-gradient(circle at center, #1e1b26, #0c0b10);
      color: #f9f3ff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      overflow: hidden;
    }

    #welcome {
      animation: fadeIn 2s ease-out forwards;
    }

    .heart {
      font-size: 4em;
      animation: pulse 2s infinite;
      color: #ff94d0;
    }

    h1 {
      margin-top: 20px;
      font-size: 1.6em;
      font-weight: normal;
      color: #ffffffcc;
    }

    #quote-box {
      margin-top: 40px;
      font-size: 1.3em;
      padding: 0 20px;
      max-width: 500px;
    }

    button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 1em;
      background-color: #d4a0f7;
      color: #1e1b26;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #f3ceff;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="welcome">
    <div class="heart">♥</div>
    <h1>Nisam napisao simfoniju, ali si ti postala sve moje note.</h1>
    <div id="quote-box">
      <p id="quote">"Ljubav mi je postala tvoje ime."</p>
    </div>
    <button onclick="newQuote()">Zauvijek</button>
  </div>

  <script>
    const quotes = [
      "Ljubav mi je postala tvoje ime.",
      "Svaka tišina odjekuje tvojim pogledom.",
      "Kad šutiš, ja postajem mir.",
      "Ne tražim vječnost. Samo da traješ.",
      "Ti nisi pjesma. Ti si razlog da postoji melodija.",
      "Da mogu otpjevati osjećaj – bilo bi tvoje ime u svakoj noti.",
      "Hana – ako ovo ikad pročitaš, znaj da si voljena na način koji ni riječi ni vrijeme ne znaju objasniti."
    ];

    function newQuote() {
      const random = Math.floor(Math.random() * quotes.length);
      document.getElementById('quote').innerText = quotes[random];
    }
  </script>
</body>
</html>
