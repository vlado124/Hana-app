<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hana – Arietta mog srca</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    #welcome {
      position: fixed;
      z-index: 999;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #1e1b26;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #welcome button {
      background-color: #d4a0f7;
      color: #1e1b26;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div id="welcome">
    <h2>Dodirni da uđeš</h2>
    <button onclick="enterApp()">Ulaz</button>
  </div>

  <div class="container" style="display:none;" id="appContent">
    <h1 class="title">Arietta mog srca</h1>
    <p class="subtitle">Posvećeno Hani Salihović</p>

    <div class="quote-box" id="quoteBox">
      <p class="quote">"Kao da sopran srca mog pjeva tvoje ime u svakoj tišini."</p>
    </div>

    <button onclick="newQuote()">Za Hanu</button>

    <audio id="music" loop>
      <source src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Ave_Maria_Bach_Gounod_-_Instrumental.ogg" type="audio/ogg">
      Tvoj preglednik ne podržava audio.
    </audio>
  </div>

  <script>
    const quotes = [
      "Kao da sopran srca mog pjeva tvoje ime u svakoj tišini.",
      "U tvom pogledu, sve arije pronalaze svoj kraj.",
      "Ti si melodija koju nijedna opera ne može otpjevati do kraja.",
      "Kada šutiš, svijet se čini kao najnježnija partitura.",
      "Hana, ti si moja jedina scena i posljednji aplauz."
    ];

    function newQuote() {
      const random = Math.floor(Math.random() * quotes.length);
      document.getElementById('quoteBox').innerHTML = `<p class="quote">${quotes[random]}</p>`;
    }

    function enterApp() {
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('appContent').style.display = 'block';
      const music = document.getElementById('music');
      music.play().catch(() => {
        console.log("Playback failed.");
      });
    }
  </script>
</body>
</html>
